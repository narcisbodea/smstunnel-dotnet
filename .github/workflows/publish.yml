# Publishes both packages to NuGet with Trusted Publishing: nuget.org trusts this workflow file, in this repository, in
# the `nuget` environment, and swaps GitHub's short-lived token for an API key that lasts one hour. No key is stored
# anywhere. See PUBLISHING.md.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: The release tag matches the version
        run: |
          version="$(dotnet msbuild src/SmsTunnel/SmsTunnel.csproj -getProperty:Version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The release tag $GITHUB_REF_NAME does not match the version $version in Directory.Build.props."
            exit 1
          fi
      - run: dotnet build SmsTunnel.sln -c Release
      - run: dotnet test --project tests/SmsTunnel.Tests/SmsTunnel.Tests.csproj -c Release --no-build
      - run: dotnet pack src/SmsTunnel/SmsTunnel.csproj -c Release --no-build -o artifacts
      - run: dotnet pack src/SmsTunnel.Extensions.DependencyInjection/SmsTunnel.Extensions.DependencyInjection.csproj -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error

  nuget:
    name: Publish to NuGet
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/SmsTunnel
    permissions:
      id-token: write # lets nuget.org check that this run is the trusted publisher
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (short-lived API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }} # the nuget.org profile name (not the email address), a repository variable
      # SmsTunnel first, then the package that depends on it. The symbol packages (.snupkg) go along.
      - name: Push
        run: |
          dotnet nuget push artifacts/SmsTunnel.[0-9]*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push artifacts/SmsTunnel.Extensions.DependencyInjection.[0-9]*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
